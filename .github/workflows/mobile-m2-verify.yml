name: Mobile Travel Luxe M2 verification
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/src/Mobile*.tsx'
      - 'apps/web/src/InventoryView.tsx'
      - 'apps/web/src/InventorySharing.tsx'
      - 'apps/web/src/CloudOrder*.tsx'
      - 'apps/web/src/CustomersView.tsx'
      - 'apps/web/src/MobileLuxeSectionHeader.tsx'
      - 'apps/web/src/mobileLuxeV2.css'
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/CloudWorkspace.tsx'
      - 'apps/web/src/CloudCatalog.tsx'
      - 'apps/web/src/BusinessReports.tsx'
      - 'apps/web/src/ShopChrome.tsx'
      - 'apps/web/src/main.tsx'
      - 'scripts/v8/mobile-luxe-m2-*.test.mjs'
      - 'package.json'
      - 'scripts/v8/mobile-m2-browser.mjs'
      - 'scripts/mobile-reform-dom.mjs'
      - 'scripts/cloud-browser-e2e.mjs'
      - 'scripts/mobile-browser-smoke.mjs'
      - 'scripts/v2-drafts-e2e.mjs'
      - 'scripts/v2-sales-e2e.mjs'
      - 'scripts/stage6-browser-e2e.mjs'
      - 'apps/api/src/inventoryValue.ts'
      - 'apps/api/src/inventoryQuery.ts'
      - 'apps/web/src/InventoryValueMetrics.tsx'
      - 'apps/web/src/inventoryValue.css'
      - 'apps/web/src/cloudInventory.ts'
      - 'scripts/inventory-value-selftest.mts'
      - 'apps/api/src/stockReturn*.ts'
      - 'apps/web/src/StockReturnPanel.tsx'
      - 'apps/web/src/stockReturns.css'
      - 'scripts/stock-return-*.m*'
      - 'apps/api/src/warehouseLive.ts'
      - 'apps/api/src/cloudRoutes.ts'
      - 'apps/web/src/liveFolderSync.ts'
      - 'apps/web/src/CloudSettings.tsx'
      - 'apps/web/src/cloudSyncAudit.ts'
      - 'scripts/live-folder-*.m*'
      - '.github/workflows/mobile-m2-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m2-verify:
    name: Build, types, Mobile UI and Windows regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exactly locked dependencies
        run: npm ci
      - name: Compile Windows and Web bundles
        run: npm run build
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Inventory value arithmetic and physical stock lifecycle
        run: npm run test:inventory-value
      - name: Stock return crash recovery, resale and backup lifecycle
        run: npm run test:stock-return
      - name: Live folder intake, deletion, offline queue and React Cloud sync
        run: npm run test:live-folder
      - name: Mobile and existing Windows UI regression
        run: npm run test:ui
      - name: Windows desktop browser acceptance
        run: node scripts/main-browser-smoke.mjs
      - name: Cloud mobile browser acceptance (isolated transport)
        run: node scripts/cloud-browser-e2e.mjs
      - name: Mobile gallery, density and clipboard browser acceptance (mock LOCAL)
        run: node scripts/mobile-browser-smoke.mjs
      - name: LOCAL draft mobile steps and real HTTP browser acceptance (disposable sandbox)
        run: node scripts/v2-drafts-e2e.mjs
      - name: LOCAL sales browser acceptance (disposable sandbox)
        run: node scripts/v2-sales-e2e.mjs
      - name: Real HTTPS LAN roles, offline state and SOLD refresh browser acceptance
        run: node --import tsx scripts/stage6-browser-e2e.mjs
      - name: Mobile viewport Chromium screenshots (375, 390, 430, 768)
        run: node scripts/v8/mobile-m2-browser.mjs
      - name: Upload available UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-m2-ui-evidence
          path: |
            artifacts/main-release/
            artifacts/mobile-m2/
            artifacts/cloud-browser/
            artifacts/v2-drafts/
            artifacts/v2-sales/
            artifacts/stage6-control/
          if-no-files-found: ignore
          retention-days: 7
