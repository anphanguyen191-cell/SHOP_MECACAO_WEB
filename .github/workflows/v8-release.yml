name: Shop Mẹ CaCao — main release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: shop-main-official-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: windows-latest
    env:
      V8_BUILD_CHANNEL: STABLE
      VITE_SHOP_RELEASE_CHANNEL: STABLE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate packaging PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/v8/package-windows.ps1').Path,[ref]$tokens,[ref]$parseErrors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/v8/smoke-desktop.ps1').Path,[ref]$tokens,[ref]$parseErrors) | Out-Null
          if($parseErrors.Count -gt 0){ $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
      - run: npm ci
      - name: Fresh-install and upgrade safety
        run: |
          npm run test:v8-layout
          node --test scripts/v8/warehouse-cloud-ui.test.mjs scripts/v8/warehouse-ownership.test.mjs scripts/v8/release-fetch.test.mjs scripts/v8/data-snapshot.test.mjs scripts/v8/cloud-handoff.test.mjs
          node --import tsx --test scripts/v8/cloud-sync-audit.test.mts
          node --test scripts/v8/image-naming-history.test.mjs
          node --check scripts/v8/node-runner.mjs
          node --check scripts/v8/release-fetch.mjs
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:gate
      - run: npm run test:cloud
      - run: npm run test:windows-update
      - shell: pwsh
        run: ./scripts/v8/package-windows.ps1
      - name: Test real Windows EXE on isolated D drive
        shell: pwsh
        run: ./scripts/v8/smoke-desktop.ps1 -Channel STABLE
      - name: Gate UI V2 official Windows release on owner acceptance
        id: ui_v2_acceptance
        shell: pwsh
        run: |
          $accepted = Test-Path 'docs/ui/windows-ui-v2-accepted.md'
          "approved=$($accepted.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if(-not $accepted){ Write-Host 'UI V2 requires owner Windows acceptance. Build remains a CI artifact, not an official release.' }
      - name: Archive Windows build for owner acceptance (not STABLE release)
        if: steps.ui_v2_acceptance.outputs.approved != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-v2-owner-acceptance
          path: artifacts/ShopMeCaCao-V8-STABLE-win-x64.zip
          if-no-files-found: error
      - name: Publish official main release
        if: steps.ui_v2_acceptance.outputs.approved == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0.${{ github.run_number }}-stable
          target_commitish: ${{ github.sha }}
          name: Shop Mẹ CaCao V8 — Main ${{ github.run_number }}
          prerelease: false
          draft: false
          make_latest: true
          files: artifacts/ShopMeCaCao-V8-STABLE-win-x64.zip
          body: |
            Bản Windows chính thức được build trực tiếp từ nhánh main.
            Các lần cập nhật và sửa lỗi sau chỉ cần mở Cài đặt > Kiểm tra & cập nhật.
            Database, cấu hình và ảnh tồn nằm trên ổ D:, không được đưa vào bộ cài.
            Vui lòng nghiệm thu trên laptop thật trước khi đưa toàn bộ kho vào vận hành.
      - name: Remove obsolete branches and preview release
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            for(const b of branches){
              if(b.name==='main'||b.protected)continue;
              try {
                await github.rest.git.deleteRef({owner,repo,ref:'heads/'+b.name});
                core.info('Removed obsolete ref: '+b.name);
              }catch(e){core.warning('Could not delete '+b.name+': '+e.message)}
            }
            const releases = await github.paginate(github.rest.repos.listReleases,{owner,repo,per_page:100});
            for(const r of releases.filter(r=>r.tag_name==='v8-preview')){
              try {
                await github.rest.repos.deleteRelease({owner,repo,release_id:r.id});
                await github.rest.git.deleteRef({owner,repo,ref:'tags/v8-preview'});
                core.info('Removed old PREVIEW release and tag');
              }catch(e){core.warning('PREVIEW cleanup requires review: '+e.message)}
            }
