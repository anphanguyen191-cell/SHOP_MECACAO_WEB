name: Shop Mẹ CaCao — main release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: shop-main-official-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: windows-latest
    env:
      V8_BUILD_CHANNEL: STABLE
      VITE_SHOP_RELEASE_CHANNEL: STABLE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate packaging PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/v8/package-windows.ps1').Path,[ref]$tokens,[ref]$parseErrors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/v8/smoke-desktop.ps1').Path,[ref]$tokens,[ref]$parseErrors) | Out-Null
          if($parseErrors.Count -gt 0){ $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
      - run: npm ci
      - name: Fresh-install and upgrade safety
        run: |
          npm run test:v8-layout
          if($LASTEXITCODE -ne 0){throw 'V8 layout tests failed'}
          node --test scripts/v8/warehouse-cloud-ui.test.mjs scripts/v8/warehouse-ownership.test.mjs scripts/v8/release-fetch.test.mjs scripts/v8/data-snapshot.test.mjs scripts/v8/cloud-handoff.test.mjs
          if($LASTEXITCODE -ne 0){throw 'Warehouse and upgrade safety tests failed'}
          node --import tsx --test scripts/v8/cloud-sync-audit.test.mts
          if($LASTEXITCODE -ne 0){throw 'Cloud sync audit tests failed'}
          node --test scripts/v8/image-naming-history.test.mjs
          if($LASTEXITCODE -ne 0){throw 'Image history tests failed'}
          node --check scripts/v8/node-runner.mjs
          if($LASTEXITCODE -ne 0){throw 'Node runner syntax failed'}
          node --check scripts/v8/release-fetch.mjs
          if($LASTEXITCODE -ne 0){throw 'Release fetch syntax failed'}
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:gate
      - name: Mobile floating actions and safe-area browser gate
        run: node scripts/mobile-browser-smoke.mjs
      - name: Cloud historical SOLD list and detail browser gate
        run: node scripts/cloud-browser-e2e.mjs
      - run: npm run test:cloud
      - run: npm run test:windows-update
      - shell: pwsh
        run: ./scripts/v8/package-windows.ps1
      - name: Test real Windows EXE on isolated D drive
        shell: pwsh
        run: ./scripts/v8/smoke-desktop.ps1 -Channel STABLE
      - name: Gate UI V2 release — owner early access or Windows acceptance
        id: ui_v2_acceptance
        shell: pwsh
        env:
          # User approved a one-time direct-update UAT on 2026-10-16. The exact
          # marker is only present on this approval commit, never on future pushes.
          OWNER_UAT_ONCE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[UI-V2-OWNER-UAT-ONCE]') }}
        run: |
          $accepted = Test-Path 'docs/ui/windows-ui-v2-accepted.md'
          $trial = (-not $accepted) -and ($env:OWNER_UAT_ONCE -eq 'true')
          $publish = $accepted -or $trial
          "approved=$($publish.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "early_access=$($trial.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if($trial){
            Write-Host 'OWNER-APPROVED EARLY ACCESS: one-time release to the existing V8 one-click STABLE updater. Windows UAT is NOT accepted.'
          }elseif(-not $accepted){
            Write-Host 'Windows UI V2 not yet accepted; preserving build as test artifact only.'
          }
      - name: Archive Windows build for owner acceptance (not STABLE release)
        if: steps.ui_v2_acceptance.outputs.approved != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-v2-owner-acceptance
          path: artifacts/ShopMeCaCao-V8-STABLE-win-x64.zip
          if-no-files-found: error
      - name: Publish official main release
        if: steps.ui_v2_acceptance.outputs.approved == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0.${{ github.run_number }}-stable
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ui_v2_acceptance.outputs.early_access == 'true' && format('Shop Mẹ CaCao V8 — UI V2.0 OWNER UAT {0}', github.run_number) || format('Shop Mẹ CaCao V8 — Main {0}', github.run_number) }}
          prerelease: false
          draft: false
          make_latest: true
          files: artifacts/ShopMeCaCao-V8-STABLE-win-x64.zip
          body: |
            Chủ shop đã trực tiếp phê duyệt Travel Luxe V2.0 làm bản nền tảng chính thức ngày 17/10/2026. Build và CI kiểm tra theo commit phát hành; lần cập nhật laptop kế tiếp là mốc xác nhận vận hành thực tế trên dữ liệu và thiết bị của cửa hàng.
            Nâng cấp bằng nút Cài đặt > Kiểm tra & cập nhật từ bản V8 đang sử dụng; không cần cài mới.
            Database, cấu hình và ảnh gốc vẫn được giữ bên ngoài bộ chương trình tại ổ D:.
            Trước khi thao tác nghiệp vụ trên kho thật, đối chiếu đường dẫn kho, phiên bản, số ảnh và các giao dịch.
            Nếu cập nhật không vượt qua kiểm tra khởi động/dữ liệu, updater phải phục hồi phiên bản cũ; xem trạng thái trên giao diện.
            Tên kênh STABLE chỉ để tương thích updater hiện hành và KHÔNG thay thế nghiệm thu laptop thực tế.
      - name: Remove obsolete branches and preview release
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            for(const b of branches){
              if(b.name==='main'||b.protected)continue;
              try {
                await github.rest.git.deleteRef({owner,repo,ref:'heads/'+b.name});
                core.info('Removed obsolete ref: '+b.name);
              }catch(e){core.warning('Could not delete '+b.name+': '+e.message)}
            }
            const releases = await github.paginate(github.rest.repos.listReleases,{owner,repo,per_page:100});
            for(const r of releases.filter(r=>r.tag_name==='v8-preview')){
              try {
                await github.rest.repos.deleteRelease({owner,repo,release_id:r.id});
                await github.rest.git.deleteRef({owner,repo,ref:'tags/v8-preview'});
                core.info('Removed old PREVIEW release and tag');
              }catch(e){core.warning('PREVIEW cleanup requires review: '+e.message)}
            }
