name: V8 stable Windows release
on:
  push:
    tags: ['v8.*.*-stable']
permissions:
  contents: write
jobs:
  gate:
    runs-on: windows-latest
    env:
      VITE_SHOP_RELEASE_CHANNEL: STABLE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm run test:v8-layout
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:cloud
      - run: npm run test:windows-update
      - shell: pwsh
        run: ./scripts/v8/package-windows.ps1
      - name: Real D-drive EXE acceptance before release
        shell: pwsh
        run: ./scripts/v8/smoke-desktop.ps1 -Channel STABLE
      - name: Publish verified Windows package
        uses: softprops/action-gh-release@v2
        with:
          name: Shop Mẹ CaCao ${{ github.ref_name }}
          prerelease: false
          draft: false
          make_latest: true
          files: artifacts/ShopMeCaCao-V8-STABLE-win-x64.zip
          body: |
            Bản phát hành chỉ dùng sau khi chủ shop nghiệm thu thực tế Windows/iPhone.
            Một gói ứng dụng Windows; database và kho ảnh không nằm trong gói.
