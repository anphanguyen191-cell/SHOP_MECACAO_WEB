name: V8 development checks
on:
  push:
    branches: ['v8/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: node --check scripts/v8/node-runner.mjs
      - run: node --check scripts/v8/release-fetch.mjs
      - run: node --check scripts/v8/data-snapshot.mjs
      - run: node --test scripts/v8/release-fetch.test.mjs scripts/v8/data-snapshot.test.mjs
      - run: node --test scripts/v8/warehouse-cloud-ui.test.mjs
      - run: npm run test:v8-layout
      - run: npm run build
      - run: npm run typecheck
