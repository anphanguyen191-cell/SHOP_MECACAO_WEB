name: Deploy GitHub Pages Preview
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=critical
      - name: Stage 6 HTTPS LAN isolated auth and role acceptance
        run: node --import tsx scripts/stage6-lan-http-e2e.mjs
      - name: V1 internal gate
        run: npm run test:gate
      - name: Stage 2 fresh release HTTP and PNG acceptance
        run: node scripts/stage2-e2e.mjs
      - name: First-time setup inherited V2 environment regression
        run: node scripts/setup-environment-regression.mjs
      - name: V1 backup to LOCAL V2 copy migration and rollback proof
        run: npm --workspace apps/api run test:local-v2-preparation
      - name: LOCAL V2 copy interactive launcher and HTTP acceptance
        run: node scripts/local-v2-preparation-e2e.mjs
      - name: Real local API end-to-end acceptance (disposable warehouse)
        run: node scripts/api-e2e-smoke.mjs
      - name: V2 draft HTTP and real Chromium acceptance (sandbox only)
        run: node scripts/v2-drafts-e2e.mjs
      - name: V2 sales sandbox HTTP and Chromium acceptance
        run: node scripts/v2-sales-e2e.mjs
      - name: Main Windows launcher and release UI browser smoke
        run: node scripts/main-browser-smoke.mjs
      - name: Mobile browser smoke (390px)
        run: node scripts/mobile-browser-smoke.mjs
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-smoke-${{ github.sha }}
          path: |
            artifacts/main-release
            artifacts/mobile-smoke
            artifacts/v2-drafts
            artifacts/v2-sales
            artifacts/local-v2-review
          if-no-files-found: ignore
  verify_windows:
    name: Windows Node ${{ matrix.node }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Windows internal gate (isolated fixtures)
        run: npm run test:gate
      - name: Windows Stage 2 fresh release HTTP and PNG acceptance
        run: node scripts/stage2-e2e.mjs
      - name: Windows first-time setup inherited V2 environment regression
        run: node scripts/setup-environment-regression.mjs
      - name: Windows V1 backup to LOCAL V2 copy migration and rollback proof
        run: npm --workspace apps/api run test:local-v2-preparation
      - name: Windows LOCAL V2 copy interactive launcher and HTTP acceptance
        run: node scripts/local-v2-preparation-e2e.mjs
      - name: Windows real HTTP acceptance (disposable warehouse)
        run: node scripts/api-e2e-smoke.mjs
      - name: Windows V2 draft HTTP acceptance (sandbox only)
        run: node scripts/v2-drafts-e2e.mjs
      - name: Windows V2 sales sandbox HTTP acceptance
        run: node scripts/v2-sales-e2e.mjs
  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [verify, verify_windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --workspace apps/web run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
