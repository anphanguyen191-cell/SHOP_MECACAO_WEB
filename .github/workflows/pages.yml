name: Deploy GitHub Pages Preview
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=critical
      - name: V1 internal gate
        run: npm run test:gate
      - name: Real local API end-to-end acceptance (disposable warehouse)
        run: node scripts/api-e2e-smoke.mjs
      - name: Mobile browser smoke (390px)
        run: node scripts/mobile-browser-smoke.mjs
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-smoke-${{ github.sha }}
          path: artifacts/mobile-smoke
          if-no-files-found: ignore
  verify_windows:
    name: Windows Node ${{ matrix.node }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Windows internal gate (isolated fixtures)
        run: npm run test:gate
      - name: Windows real HTTP acceptance (disposable warehouse)
        run: node scripts/api-e2e-smoke.mjs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [verify, verify_windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --workspace apps/web run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
