name: Deploy Shop Mẹ CaCao mobile PR preview
on:
  workflow_run:
    workflows: ["Mobile draft PNG preview"]
    types: [completed]
    branches: [fix/mobile-draft-png-snapshot-20261105]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download successful preview build
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ github.event.workflow_run.id }}
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production and preview paths for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-deploy

      - name: Deploy preview bundle
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-deploy

      - name: Comment the direct iPhone preview link on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests || [];
            const number = prs[0]?.number;
            if (!number) {
              core.notice('No associated pull request was included in the workflow_run payload.');
              return;
            }
            const rawBase = process.env.PAGES_URL;
            const base = rawBase.endsWith('/') ? rawBase : rawBase + '/';
            const url = `${base}pr-preview/pr-${number}/?cloud=1`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: [
                'Mobile preview đã deploy thành công:',
                url,
                '',
                'Lưu ý: preview dùng cùng Supabase Cloud và dữ liệu shop thật. Chỉ thử đơn nháp; không xác nhận SOLD hoặc ghi nhận giao dịch tiền.'
              ].join(String.fromCharCode(10))
            });
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
